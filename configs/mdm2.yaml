name: mdm2_pip2

# Pre-parameterised, solvated, pre-equilibrated MDM2–Pip2 inputs that ship with
# a3fe 0.5.0: a3fe/data/example_calc_set/mdm2_short/input/{bound,free}_preequil.{prm7,rst7}
# (bound: 25,023 atoms; free: 4,404). prep.py copies them into each leg's input dir.
a3fe_example: mdm2_short

replicates: 4
ns_per_tape: 2.0
equil_ps: 1000            # ensemble equilibration per replicate (a3fe default is 5000)

# u_kl + dH/dλ written every N steps (4 fs each). 1000 steps = 4 ps. Toluene used
# a3fe's 200 (0.8 ps), but replay/MBAR only ever used every 5th sample.
energy_frequency: 1000
# Coordinates written every N steps. 50000 = 200 ps -> 10 frames per 2 ns tape;
# a3fe's 5000 would be ~30 MB of trajectory per bound run.
buffered_coords_freq: 50000

workdir: /workspace/runs   # on each pod's own disk, not in git

# a3fe 0.5.0 defaults (SomdSystemPreparationConfig) for restrain/discharge;
# vanish = a3fe defaults + midpoint of each adjacent pair, as for toluene.
# a3fe bound vanish: [0.0, 0.026, 0.054, 0.083, 0.111, 0.14, 0.173, 0.208, 0.247, 0.286,
#   0.329, 0.373, 0.417, 0.467, 0.514, 0.564, 0.623, 0.696, 0.833, 1.0]
# a3fe free vanish: [0.0, 0.026, 0.055, 0.09, 0.126, 0.164, 0.202, 0.239, 0.276, 0.314,
#   0.354, 0.396, 0.437, 0.478, 0.518, 0.559, 0.606, 0.668, 0.762, 1.0]
legs:
  bound:
    restrain: [0.0, 1.0]
    discharge: [0.0, 0.291, 0.54, 0.776, 1.0]
    vanish: [0.0, 0.013, 0.026, 0.04, 0.054, 0.0685, 0.083, 0.097, 0.111, 0.1255, 0.14,
             0.1565, 0.173, 0.1905, 0.208, 0.2275, 0.247, 0.2665, 0.286, 0.3075, 0.329,
             0.351, 0.373, 0.395, 0.417, 0.442, 0.467, 0.4905, 0.514, 0.539, 0.564,
             0.5935, 0.623, 0.6595, 0.696, 0.7645, 0.833, 0.9165, 1.0]
  free:
    discharge: [0.0, 0.222, 0.447, 0.713, 1.0]
    vanish: [0.0, 0.013, 0.026, 0.0405, 0.055, 0.0725, 0.09, 0.108, 0.126, 0.145, 0.164,
             0.183, 0.202, 0.2205, 0.239, 0.2575, 0.276, 0.295, 0.314, 0.334, 0.354, 0.375,
             0.396, 0.4165, 0.437, 0.4575, 0.478, 0.498, 0.518, 0.5385, 0.559, 0.5825, 0.606,
             0.637, 0.668, 0.715, 0.762, 0.881, 1.0]
